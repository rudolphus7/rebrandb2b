name: Daily Sync

on:
  schedule:
    # Щодня о 10:00 за Києвом (08:00 UTC у зимовий час / 07:00 UTC у літній)
    - cron: '0 8 * * *'
  workflow_dispatch: # Кнопка для ручного запуску з GitHub Actions

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call Sync API
        run: |
          curl --fail-with-body -sS -X GET "${{ secrets.SITE_URL }}/api/sync?key=${{ secrets.CRON_SECRET }}"
